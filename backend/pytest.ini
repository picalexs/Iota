[pytest]
# Pytest Configuration for Quantum VQE Studio Backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Add options for test runs
addopts =
    -v
    --strict-markers
    --tb=short

# Asyncio mode for pytest-asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Warning policy
filterwarnings =
    error::pytest.PytestDeprecationWarning

# Integration profiles
markers =
    postgres: requires a PostgreSQL database created from Alembic migrations
    redis: requires a Redis server for RQ contract tests

# Test paths
testpaths = tests

# Coverage options (when using pytest-cov)
[coverage:run]
branch = True
source = app
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
