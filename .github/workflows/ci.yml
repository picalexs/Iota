name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  docs:
    name: Documentation targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check local documentation targets
        run: python3 scripts/checks/check-doc-targets.py

  python-static:
    name: Python static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install CI tools
        run: python -m pip install -r requirements-ci.lock
      - name: Compile Python source
        run: python -m compileall backend worker shared scripts/contracts
      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F,I backend worker shared scripts/contracts

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            requirements-ci.lock
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.lock -r requirements-ci.lock
      - name: Run backend tests
        env:
          PYTHONPATH: .:backend
        run: python -m pytest backend/tests/unit -q

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            worker/requirements.lock
            requirements-ci.lock
      - name: Install worker requirements
        run: python -m pip install -r worker/requirements.lock -r requirements-ci.lock
      - name: Run worker tests
        env:
          PYTHONPATH: .
        run: python -m pytest worker/tests -q

  api-contract:
    name: Generated API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            requirements-ci.lock
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.lock -r requirements-ci.lock
          npm --prefix frontend ci
      - name: Check generated API types
        run: npm --prefix frontend run check:generated-types

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Run lint
        run: npm --prefix frontend run lint
      - name: Run tests
        run: npm --prefix frontend run test:run
      - name: Build frontend
        run: npm --prefix frontend run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Render Compose configuration
        run: docker compose config --quiet
      - name: Render production Compose configuration
        env:
          ALLOW_INSECURE_DEFAULTS: "false"
          DB_PASSWORD: ci-only-db-password
          DOCS_ENABLED: "false"
          REDIS_PASSWORD: ci-only-redis-password
          TRUSTED_HOSTS: localhost,127.0.0.1
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
